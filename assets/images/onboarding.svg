<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow & Shapes -->
  <circle cx="250" cy="190" r="160" fill="url(#bgGrad)" opacity="0.7"/>
  <circle cx="100" cy="110" r="45" fill="#C7D2FE" opacity="0.4"/>
  <circle cx="390" cy="270" r="60" fill="#DDD6FE" opacity="0.5"/>
  <circle cx="410" cy="90" r="28" fill="#FBCFE8" opacity="0.6"/>

  <!-- Decorative Floating Sparkles -->
  <path d="M120 70 L123 78 L131 81 L123 84 L120 92 L117 84 L109 81 L117 78 Z" fill="#6366F1" opacity="0.8"/>
  <path d="M370 60 L372 65 L377 67 L372 69 L370 74 L368 69 L363 67 L368 65 Z" fill="#EC4899" opacity="0.8"/>
  <path d="M85 240 L87 245 L92 247 L87 249 L85 254 L83 249 L78 247 L83 245 Z" fill="#10B981" opacity="0.8"/>

  <!-- Main Central Productivity Board -->
  <g filter="url(#softShadow)">
    <rect x="110" y="55" width="280" height="265" rx="24" fill="#FFFFFF"/>
    <!-- Header of Board -->
    <rect x="110" y="55" width="280" height="48" rx="24" fill="url(#purpleGrad)"/>
    <rect x="110" y="80" width="280" height="23" fill="url(#purpleGrad)"/>
    <!-- Window Dots -->
    <circle cx="138" cy="79" r="5" fill="#F87171"/>
    <circle cx="152" cy="79" r="5" fill="#FBBF24"/>
    <circle cx="166" cy="79" r="5" fill="#34D399"/>
    <!-- Header Title Bar Mockup -->
    <rect x="195" y="74" width="110" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Progress Bar Widget inside Board -->
  <g>
    <rect x="135" y="120" width="230" height="38" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="155" cy="139" r="10" fill="#EEF2FF"/>
    <path d="M152 139 L155 142 L159 136" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="175" y="132" width="90" height="7" rx="3.5" fill="#334155"/>
    <rect x="175" y="142" width="55" height="5" rx="2.5" fill="#94A3B8"/>
    <!-- Mini Progress Ring / Bar -->
    <rect x="290" y="134" width="60" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="290" y="134" width="48" height="8" rx="4" fill="url(#purpleGrad)"/>
  </g>

  <!-- Task Item 1 (Completed) -->
  <g>
    <rect x="135" y="170" width="230" height="40" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <!-- Checked Circle -->
    <circle cx="155" cy="190" r="11" fill="url(#greenGrad)"/>
    <path d="M151 190 L154 193 L160 186" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Strike-through text -->
    <rect x="175" y="184" width="110" height="6" rx="3" fill="#64748B"/>
    <line x1="175" y1="187" x2="285" y2="187" stroke="#10B981" stroke-width="2"/>
    <rect x="175" y="193" width="60" height="5" rx="2.5" fill="#94A3B8"/>
    <!-- Priority Pill -->
    <rect x="305" y="181" width="46" height="18" rx="9" fill="#DCFCE7"/>
    <text x="328" y="193" font-size="8" font-family="sans-serif" font-weight="bold" fill="#15803D" text-anchor="middle">DONE</text>
  </g>

  <!-- Task Item 2 (In Progress) -->
  <g>
    <rect x="135" y="222" width="230" height="40" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Empty Checkbox -->
    <rect x="145" y="180" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" transform="matrix(1 0 0 1 0 52)"/>
    <rect x="175" y="235" width="95" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="175" y="246" width="65" height="5" rx="2.5" fill="#94A3B8"/>
    <!-- High Priority Pill -->
    <rect x="305" y="233" width="46" height="18" rx="9" fill="#FEE2E2"/>
    <text x="328" y="245" font-size="8" font-family="sans-serif" font-weight="bold" fill="#B91C1C" text-anchor="middle">HIGH</text>
  </g>

  <!-- Floating Left Card: Today's Streak / Success -->
  <g filter="url(#cardShadow)">
    <rect x="42" y="150" width="105" height="85" rx="18" fill="#FFFFFF"/>
    <circle cx="75" cy="180" r="18" fill="#FEF3C7"/>
    <path d="M75 169 L77 176 L84 176 L78 181 L80 188 L75 183 L70 188 L72 181 L66 176 L73 176 Z" fill="#F59E0B"/>
    <rect x="54" y="206" width="65" height="6" rx="3" fill="#0F172A"/>
    <rect x="54" y="217" width="45" height="5" rx="2.5" fill="#F59E0B"/>
  </g>

  <!-- Floating Right Card: Dynamic Metric -->
  <g filter="url(#cardShadow)">
    <rect x="345" y="130" width="112" height="92" rx="18" fill="#FFFFFF"/>
    <circle cx="376" cy="162" r="16" fill="#EEF2FF"/>
    <path d="M370 166 L374 157 L379 161 L384 153" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="365" y="196" font-size="14" font-family="sans-serif" font-weight="800" fill="#1E1B4B">92%</text>
    <text x="365" y="209" font-size="8" font-family="sans-serif" font-weight="600" fill="#6B7280">Productivity</text>
  </g>

  <!-- Floating Bottom Bell Pill -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="285" width="140" height="38" rx="19" fill="#1E1B4B"/>
    <circle cx="289" cy="304" r="10" fill="url(#accentGrad)"/>
    <!-- Bell icon -->
    <path d="M289 298 C287 298 285 300 285 303 L284 306 L294 306 L293 303 C293 300 291 298 289 298 Z M287.5 307 C287.5 308 288.2 309 289 309 C289.8 309 290.5 308 290.5 307 Z" fill="#FFFFFF"/>
    <text x="306" y="308" font-size="10.5" font-family="sans-serif" font-weight="600" fill="#FFFFFF">3 Tasks Due Today</text>
  </g>
</svg>
